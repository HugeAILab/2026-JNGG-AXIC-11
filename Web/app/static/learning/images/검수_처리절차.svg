<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><rect width="1400" height="720" fill="#f5f7fa"/><style>text{font-family:Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif}</style><text x="70" y="85" font-size="36" font-weight="700" fill="#15304a">용접부 검수 처리 절차</text><text x="70" y="124" font-size="20" fill="#526579">관찰 사실과 추정 원인을 구분하여 기록합니다</text><rect x="70" y="175" width="400" height="135" rx="12" fill="white" stroke="#ccd6e0"/><text x="92" y="211" font-size="20" fill="#267889">01</text><text x="92" y="248" font-size="27" font-weight="700" fill="#15304a">대상 확인</text><text x="92" y="284" font-size="19" fill="#526579">부재·이음 번호와 원본 대조</text><rect x="500" y="175" width="400" height="135" rx="12" fill="white" stroke="#ccd6e0"/><text x="522" y="211" font-size="20" fill="#267889">02</text><text x="522" y="248" font-size="27" font-weight="700" fill="#15304a">형상 확인</text><text x="522" y="284" font-size="19" fill="#526579">위치·형상·의심 유형 기록</text><rect x="930" y="175" width="400" height="135" rx="12" fill="white" stroke="#ccd6e0"/><text x="952" y="211" font-size="20" fill="#267889">03</text><text x="952" y="248" font-size="27" font-weight="700" fill="#15304a">측정·검사</text><text x="952" y="284" font-size="19" fill="#526579">실측 및 필요한 추가 검사</text><rect x="70" y="340" width="400" height="135" rx="12" fill="white" stroke="#ccd6e0"/><text x="92" y="376" font-size="20" fill="#267889">04</text><text x="92" y="413" font-size="27" font-weight="700" fill="#15304a">기준 대조</text><text x="92" y="449" font-size="19" fill="#526579">문서·개정·판정 조항 확인</text><rect x="500" y="340" width="400" height="135" rx="12" fill="white" stroke="#ccd6e0"/><text x="522" y="376" font-size="20" fill="#267889">05</text><text x="522" y="413" font-size="27" font-weight="700" fill="#15304a">보수 검토</text><text x="522" y="449" font-size="19" fill="#526579">범위·방법·승인 절차 확인</text><rect x="930" y="340" width="400" height="135" rx="12" fill="white" stroke="#ccd6e0"/><text x="952" y="376" font-size="20" fill="#267889">06</text><text x="952" y="413" font-size="27" font-weight="700" fill="#15304a">재검사·종결</text><text x="952" y="449" font-size="19" fill="#526579">검사 결과와 판정 근거 확인</text><rect x="70" y="540" width="1260" height="90" rx="12" fill="#fff1df"/><text x="96" y="578" font-size="24" font-weight="700" fill="#955819">유형·측정값·적용 기준이 불명확하면 판정 보류</text><text x="96" y="610" font-size="20" fill="#725b45">보류 사유와 추가 확인 항목을 기록하고, 확인 결과를 확보한 후 판정을 진행합니다.</text><text x="70" y="682" font-size="17" fill="#647487">교육용 업무 흐름도 · 실제 작업과 종결 권한은 현장 품질 절차에 따름</text></svg>